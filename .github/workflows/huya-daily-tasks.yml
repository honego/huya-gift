---
name: Huya daily tasks

on:
  schedule:
    - cron: 11 18 * * *
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      version:
        description: Running version
        type: choice
        options: [v2, v1]
        default: v2
      room_url:
        description: "Target Livestream URL (like: https://www.huya.com/123456)"
        type: string
        default: ""
      gift_count:
        description: Number of gifts (0 means all)
        type: string
        default: "0"
      daka:
        description: Daily check-in
        type: choice
        options: ["true", "false"]
        default: "true"
      welfare:
        description: Claim 10 Huya Food daily (v2 only)
        type: choice
        options: ["true", "false"]
        default: "true"
      wechat_push:
        description: Send report via WeCom
        type: choice
        options: ["true", "false"]
        default: "true"

permissions:
  contents: read

jobs:
  tasks:
    name: Huya daily tasks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install browser
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.version == 'v1') || (github.event_name != 'workflow_dispatch' && vars.HUYA_VERSION == 'v1') }}
        run: |
          playwright install --with-deps chromium

      - name: Check python syntax
        run: python -m compileall -q .

      - name: Huya daily tasks
        env:
          HUYA_VERSION: ${{ inputs.version || vars.HUYA_VERSION || 'v2' }}
          HUYA_ROOM_URL: ${{ inputs.room_url || vars.HUYA_ROOM_URL || secrets.HUYA_ROOM_URL || '' }}
          HUYA_GIFT_COUNT: ${{ inputs.gift_count || vars.HUYA_GIFT_COUNT || '0' }}
          HUYA_DAKA: ${{ inputs.daka || vars.HUYA_DAKA || 'true' }}
          HUYA_WELFARE: ${{ inputs.welfare || vars.HUYA_WELFARE || 'true' }}
          HUYA_WECHAT_PUSH: ${{ inputs.wechat_push || vars.HUYA_WECHAT_PUSH || 'true' }}
          HUYA_LOCAL_DEBUG: "false"
          HUYA_COOKIE: ${{ secrets.HUYA_COOKIE }}
          HUYA_ACCOUNT: ${{ secrets.HUYA_ACCOUNT }}
          HUYA_PASSWORD: ${{ secrets.HUYA_PASSWORD }}
          WX_WEBHOOK: ${{ secrets.WX_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: python3 main.py

      - name: Upload screenshot the error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 1
